    - id: preprocess
      type: custom
      data:
        type: code
        title: 规则预处理
        desc: 空消息、问候、确认和明确转人工请求不消耗模型调用。
        code_language: python3
        code: "import json\nimport re\n\n\ndef result(reply, intent, route, signals=None):\n\
          \    return json.dumps({\n        \"reply\": reply,\n        \"primary_intent\"\
          : intent,\n        \"route\": route,\n        \"sentiment\": \"neutral\"\
          ,\n        \"urgency\": \"normal\",\n        \"handoff_required\": route\
          \ == \"handoff\",\n        \"handoff_signals\": signals or [],\n       \
          \ \"answer_source\": \"rule\",\n        \"collected_info\": {},\n      \
          \  \"missing_fields\": [],\n        \"follow_up_question\": \"\",\n    \
          \    \"parse_status\": \"rule\",\n    }, ensure_ascii=False)\n\n\ndef main(query):\n\
          \    current = str(query or \"\").strip()\n    compact = re.sub(r\"[\\s，。！？!?、~～,.]+\"\
          , \"\", current).lower()\n    greetings = {\"你好\", \"您好\", \"在吗\", \"有人吗\"\
          , \"嗨\", \"哈喽\", \"hello\", \"hi\"}\n    thanks = {\"好的\", \"好\", \"收到\"\
          , \"明白了\", \"知道了\", \"谢谢\", \"感谢\", \"再见\"}\n    negative_handoff = any(term\
          \ in compact for term in (\n        \"不用转人工\", \"不要转人工\", \"不需要人工\", \"\
          先不转人工\", \"不用找客服\",\n    ))\n    human_terms = (\n        \"转人工\", \"人工客服\"\
          , \"找客服\", \"找顾问\", \"投诉\", \"人工处理\",\n        \"让人联系我\", \"让同事联系我\", \"\
          安排顾问\",\n    )\n\n    if not current:\n        return {\n            \"\
          route\": \"fast\",\n            \"normalized_query\": \"\",\n          \
          \  \"fast_result\": result(\"请告诉我您想咨询的问题，我会先帮您判断并处理。\", \"empty\", \"fast\"\
          ),\n        }\n    if compact in greetings:\n        return {\n        \
          \    \"route\": \"fast\",\n            \"normalized_query\": current,\n\
          \            \"fast_result\": result(\"您好，请告诉我您想咨询的产品、服务或售后问题。\", \"greeting\"\
          , \"fast\"),\n        }\n    if compact in thanks:\n        return {\n \
          \           \"route\": \"fast\",\n            \"normalized_query\": current,\n\
          \            \"fast_result\": result(\"好的，如有新的问题可以继续告诉我。\", \"acknowledgement\"\
          , \"fast\"),\n        }\n    if not negative_handoff and any(term in compact\
          \ for term in human_terms):\n        return {\n            \"route\": \"\
          handoff\",\n            \"normalized_query\": current,\n            \"fast_result\"\
          : result(\n                \"我已记录您的人工服务请求，将为您转接人工客服继续处理。\",\n          \
          \      \"human_request\",\n                \"handoff\",\n              \
          \  [\"explicit_human_request\"],\n            ),\n        }\n    return\
          \ {\"route\": \"core\", \"normalized_query\": current, \"fast_result\":\
          \ \"\"}\n"
        variables:
        - variable: query
          value_selector:
          - sys
          - query
        outputs:
          route:
            type: string
            children: null
          normalized_query:
            type: string
            children: null
          fast_result:
            type: string
            children: null
        selected: false
