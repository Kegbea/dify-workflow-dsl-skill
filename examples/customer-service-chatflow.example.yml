    - id: early_handoff
      type: custom
      data:
        type: code
        title: 规则转人工封装
        desc: 生成结构化人工交接摘要。
        code_language: python3
        code: "import json\n\n\ndef main(source_result):\n    try:\n        data =\
          \ json.loads(str(source_result or \"{}\"))\n    except Exception:\n    \
          \    data = {}\n    data[\"route\"] = \"handoff\"\n    data[\"handoff_required\"\
          ] = True\n    data[\"answer_source\"] = data.get(\"answer_source\") or \"\
          rule\"\n    if not str(data.get(\"reply\") or \"\").strip():\n        data[\"\
          reply\"] = \"我已记录您的问题，将转接人工客服继续处理。\"\n    data[\"handoff_summary\"] = {\n\
          \        \"intent\": data.get(\"primary_intent\") or \"general_inquiry\"\
          ,\n        \"urgency\": data.get(\"urgency\") or \"normal\",\n        \"\
          signals\": data.get(\"handoff_signals\") or [],\n        \"collected_info\"\
          : data.get(\"collected_info\") or {},\n    }\n    return {\"result\": json.dumps(data,\
          \ ensure_ascii=False)}\n"
        variables:
        - variable: source_result
          value_selector:
          - preprocess
          - fast_result
        outputs:
          result:
            type: string
            children: null
        selected: false
      position:
        x: 1200
        y: 180
      positionAbsolute:
        x: 1200
        y: 180
      width: 242
      height: 115
      selected: false
      sourcePosition: right
      targetPosition: left
