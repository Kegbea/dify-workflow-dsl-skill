    - id: core_llm
      type: custom
      data:
        type: llm
        title: 意图、情绪与风险分析
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: REPLACE_WITH_MODEL_NAME
          provider: REPLACE_WITH_MODEL_PROVIDER
        context:
          enabled: false
          variable_selector: []
        memory:
          window:
            enabled: true
            size: 8
          query_prompt_template: '{{#sys.query#}}


            {{#sys.files#}}'
          role_prefix:
            user: ''
            assistant: ''
        prompt_template:
        - id: fff5fdea-8462-5f2a-b0f9-76c036ad763f
          role: system
          text: "你是企业智能客服中枢。一次调用同时完成：识别意图、风险判断、信息提取、回复草拟和路由决策。\n\n工作规则：\n1. 只依据用户本轮消息与对话记忆，不确定的信息必须留空，禁止编造价格、库存、合同、交期、政策和企业事实。\n\
            2. route 只能是 direct、knowledge 或 handoff：\n   - 企业介绍、地址、营业时间、服务范围、流程、产品事实选择\
            \ knowledge；\n   - 明确要求人工、投诉、退款争议、隐私安全、法律合规、威胁、自伤他伤、连续无法解决选择 handoff；\n\
            \   - 需求澄清、一般咨询、闲聊和可以安全直接回答的问题选择 direct。\n3. 回复简洁自然；需要补充信息时每轮最多追问两个最关键字段。\n\
            4. sentiment 只能是 positive、neutral、negative；urgency 只能是 low、normal、high、critical。\n\
            5. collected_info 仅放用户明确提供的信息。missing_fields 仅放下一步确实需要的字段。\n6. handoff_required\
            \ 必须与 route 是否为 handoff 一致。handoff_signals 可选：explicit_human_request、complaint、refund_dispute、privacy_security、legal_compliance、safety_risk、repeated_unresolved。\n\
            \n只输出一个合法 JSON 对象，不要 Markdown，不要解释：\n{\n  \"reply\": \"给用户看的回复\",\n  \"\
            primary_intent\": \"意图名称\",\n  \"route\": \"direct|knowledge|handoff\"\
            ,\n  \"sentiment\": \"positive|neutral|negative\",\n  \"urgency\": \"\
            low|normal|high|critical\",\n  \"handoff_required\": false,\n  \"handoff_signals\"\
            : [],\n  \"answer_source\": \"model|knowledge|rule\",\n  \"collected_info\"\
            : {},\n  \"missing_fields\": [],\n  \"follow_up_question\": \"\",\n  \"\
            reason_code\": \"简短机器可读原因\"\n}"
        - id: 751eef78-1499-58f0-9468-d6e77531bc09
          role: user
          text: '用户本轮消息：

            {{#preprocess.normalized_query#}}'
        vision:
          enabled: false
        selected: false
      position:
        x: 1200
        y: 520
      positionAbsolute:
        x: 1200
        y: 520
      width: 242
      height: 100
      selected: false
