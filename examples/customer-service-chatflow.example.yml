    - id: risk_handoff
      type: custom
      data:
        type: code
        title: 风险转人工封装
        desc: 保留模型分析结果并生成客服交接摘要。
        code_language: python3
        code: "import json\n\n\ndef main(source_result):\n    try:\n        data =\
          \ json.loads(str(source_result or \"{}\"))\n    except Exception:\n    \
          \    data = {}\n    data[\"route\"] = \"handoff\"\n    data[\"handoff_required\"\
