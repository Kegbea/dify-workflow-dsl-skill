    - id: core_parse
      type: custom
      data:
        type: code
        title: 模型结果校验与路由
        desc: 清洗模型 JSON、约束枚举并执行高风险兜底路由。
        code_language: python3
        code: "import json\nimport re\n\n\nROUTES = {\"direct\", \"knowledge\", \"\
          handoff\"}\nSENTIMENTS = {\"positive\", \"neutral\", \"negative\"}\nURGENCIES\
          \ = {\"low\", \"normal\", \"high\", \"critical\"}\nSIGNALS = {\n    \"explicit_human_request\"\
          , \"complaint\", \"refund_dispute\", \"privacy_security\",\n    \"legal_compliance\"\
          , \"safety_risk\", \"repeated_unresolved\",\n}\n\n\ndef load(raw):\n   \
          \ text = re.sub(r\"^```(?:json)?\\s*|\\s*```$\", \"\", str(raw or \"\").strip(),\
          \ flags=re.I)\n    start, end = text.find(\"{\"), text.rfind(\"}\")\n  \
          \  if start < 0 or end <= start:\n        return {}\n    try:\n        value\
          \ = json.loads(text[start:end + 1])\n        return value if isinstance(value,\
          \ dict) else {}\n    except Exception:\n        return {}\n\n\ndef clean_list(value):\n\
          \    if not isinstance(value, list):\n        return []\n    return list(dict.fromkeys(str(item).strip()\
          \ for item in value if str(item).strip()))\n\n\ndef main(raw_text):\n  \
          \  data = load(raw_text)\n    route = str(data.get(\"route\") or \"direct\"\
          ).strip().lower()\n    route = route if route in ROUTES else \"direct\"\n\
          \    signals = [item for item in clean_list(data.get(\"handoff_signals\"\
          )) if item in SIGNALS]\n    if signals and any(item in signals for item\
          \ in (\n        \"explicit_human_request\", \"refund_dispute\", \"privacy_security\"\
          ,\n        \"legal_compliance\", \"safety_risk\",\n    )):\n        route\
          \ = \"handoff\"\n    sentiment = str(data.get(\"sentiment\") or \"neutral\"\
          ).lower()\n    sentiment = sentiment if sentiment in SENTIMENTS else \"\
          neutral\"\n    urgency = str(data.get(\"urgency\") or \"normal\").lower()\n\
          \    urgency = urgency if urgency in URGENCIES else \"normal\"\n    info\
          \ = data.get(\"collected_info\") if isinstance(data.get(\"collected_info\"\
          ), dict) else {}\n    info = {str(k): v for k, v in info.items() if v not\
          \ in (None, \"\", [], {})}\n    reply = str(data.get(\"reply\") or \"\"\
          ).strip()\n    if not reply:\n        reply = \"我还需要了解更具体的问题，请补充您希望处理的事项。\"\
          \n    result = {\n        \"reply\": reply,\n        \"primary_intent\"\
          : str(data.get(\"primary_intent\") or \"general_inquiry\").strip(),\n  \
          \      \"route\": route,\n        \"sentiment\": sentiment,\n        \"\
          urgency\": urgency,\n        \"handoff_required\": route == \"handoff\"\
          ,\n        \"handoff_signals\": signals,\n        \"answer_source\": \"\
          knowledge\" if route == \"knowledge\" else \"model\",\n        \"collected_info\"\
          : info,\n        \"missing_fields\": clean_list(data.get(\"missing_fields\"\
          )),\n        \"follow_up_question\": str(data.get(\"follow_up_question\"\
          ) or \"\").strip(),\n        \"reason_code\": str(data.get(\"reason_code\"\
          ) or \"model_route\").strip(),\n        \"parse_status\": \"ok\" if data\
          \ else \"fallback\",\n    }\n    return {\"route\": route, \"result\": json.dumps(result,\
          \ ensure_ascii=False)}\n"
        variables:
        - variable: raw_text
          value_selector:
          - core_llm
          - text
        outputs:
          route:
            type: string
            children: null
          result:
            type: string
            children: null
        selected: false
