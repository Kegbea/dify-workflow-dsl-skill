    - id: merge_profile
      type: custom
      data:
        type: code
        title: 多模态画像合并
        desc: 合并现有画像与三路增量，去重、过滤敏感字段、保留证据和冲突。
        code_language: python3
        code: "import json\nimport re\n\n\nSENSITIVE_KEYS = {\n    \"id_card\", \"\
          identity_number\", \"exact_address\", \"password\", \"health\",\n    \"\
          religion\", \"political_view\", \"race\", \"sexual_orientation\",\n}\n\n\
          \ndef load(value):\n    text = re.sub(r\"^```(?:json)?\\s*|\\s*```$\", \"\
          \", str(value or \"\").strip(), flags=re.I)\n    start, end = text.find(\"\
          {\"), text.rfind(\"}\")\n    if start < 0 or end <= start:\n        return\
          \ {}\n    try:\n        result = json.loads(text[start:end + 1])\n     \
          \   return result if isinstance(result, dict) else {}\n    except Exception:\n\
          \        return {}\n\n\ndef unique(values):\n    result = []\n    for item\
          \ in values:\n        marker = json.dumps(item, ensure_ascii=False, sort_keys=True)\
          \ if isinstance(item, (dict, list)) else str(item)\n        if marker not\
          \ in {json.dumps(v, ensure_ascii=False, sort_keys=True) if isinstance(v,\
          \ (dict, list)) else str(v) for v in result}:\n            result.append(item)\n\
          \    return result\n\n\ndef main(payload_json, text_analysis, image_analysis,\
          \ behavior_analysis):\n    payload = load(payload_json)\n    text_data =\
          \ load(text_analysis)\n    image_data = load(image_analysis)\n    behavior_data\
          \ = load(behavior_analysis)\n    current = payload.get(\"current_profile\"\
          ) if isinstance(payload.get(\"current_profile\"), dict) else {}\n    profile\
          \ = {k: v for k, v in current.items() if str(k).lower() not in SENSITIVE_KEYS}\n\
          \    patch = text_data.get(\"profile_patch\") if isinstance(text_data.get(\"\
          profile_patch\"), dict) else {}\n    for key, value in patch.items():\n\
          \        if str(key).lower() not in SENSITIVE_KEYS and value not in (None,\
          \ \"\", [], {}):\n            profile[str(key)] = value\n\n    items = []\n\
          \    for source in (text_data, image_data, behavior_data):\n        for\
          \ item in source.get(\"profile_items\", []) if isinstance(source.get(\"\
          profile_items\"), list) else []:\n            if not isinstance(item, dict)\
          \ or str(item.get(\"key\") or \"\").lower() in SENSITIVE_KEYS:\n       \
          \         continue\n            try:\n                confidence = max(0.0,\
          \ min(1.0, float(item.get(\"confidence\", 0))))\n            except Exception:\n\
          \                confidence = 0.0\n            cleaned = dict(item)\n  \
          \          cleaned[\"confidence\"] = confidence\n            if cleaned.get(\"\
          value\") not in (None, \"\", [], {}):\n                items.append(cleaned)\n\
          \n    tags, segments, conflicts = [], [], []\n    for source in (text_data,\
          \ image_data, behavior_data):\n        tags.extend(source.get(\"tags\",\
          \ []) if isinstance(source.get(\"tags\"), list) else [])\n        segments.extend(source.get(\"\
          segments\", []) if isinstance(source.get(\"segments\"), list) else [])\n\
          \        conflicts.extend(source.get(\"conflicts\", []) if isinstance(source.get(\"\
          conflicts\"), list) else [])\n    intent_score = behavior_data.get(\"intent_score\"\
          , text_data.get(\"intent_score\", 0))\n    try:\n        intent_score =\
          \ max(0, min(100, int(float(intent_score))))\n    except Exception:\n  \
          \      intent_score = 0\n    intent_level = behavior_data.get(\"intent_level\"\
          ) or text_data.get(\"intent_level\") or \"low\"\n\n    summaries = [str(payload.get(\"\
          history_summary\") or \"\").strip(), str(text_data.get(\"updated_summary\"\
          ) or \"\").strip()]\n    summary = \"；\".join(unique([item for item in summaries\
          \ if item]))[:500]\n    evidence_messages, evidence_events = [], []\n  \
          \  for source in (text_data, image_data):\n        evidence_messages.extend(source.get(\"\
          evidence_message_ids\", []) if isinstance(source.get(\"evidence_message_ids\"\
          ), list) else [])\n    evidence_events.extend(behavior_data.get(\"evidence_event_ids\"\
          , []) if isinstance(behavior_data.get(\"evidence_event_ids\"), list) else\
          \ [])\n    next_action = str(\n        behavior_data.get(\"next_best_action\"\
          )\n        or text_data.get(\"next_best_action\")\n        or image_data.get(\"\
          next_best_action\")\n        or \"\"\n    ).strip()\n    consent = payload.get(\"\
          consent\") if isinstance(payload.get(\"consent\"), dict) else {}\n    profile_allowed\
          \ = consent.get(\"profile_analysis\", True) is not False\n    result = {\n\
          \        \"schema_version\": \"1.0\",\n        \"user_id\": str(payload.get(\"\
          user_id\") or payload.get(\"relation_id\") or \"\"),\n        \"profile_patch\"\
          : profile if profile_allowed else {},\n        \"profile_items\": unique(items)\
          \ if profile_allowed else [],\n        \"tags\": unique([str(v) for v in\
          \ tags if str(v).strip()]) if profile_allowed else [],\n        \"segments\"\
          : unique([str(v) for v in segments if str(v).strip()]) if profile_allowed\
          \ else [],\n        \"needs\": unique(text_data.get(\"needs\", []) if isinstance(text_data.get(\"\
          needs\"), list) else []) if profile_allowed else [],\n        \"pain_points\"\
          : unique(text_data.get(\"pain_points\", []) if isinstance(text_data.get(\"\
          pain_points\"), list) else []) if profile_allowed else [],\n        \"intent_level\"\
          : intent_level if profile_allowed else \"low\",\n        \"intent_score\"\
          : intent_score if profile_allowed else 0,\n        \"lifecycle_stage\":\
          \ str(text_data.get(\"lifecycle_stage\") or \"unknown\") if profile_allowed\
          \ else \"unknown\",\n        \"visual_preferences\": unique(image_data.get(\"\
          visual_preferences\", []) if isinstance(image_data.get(\"visual_preferences\"\
          ), list) else []) if profile_allowed else [],\n        \"product_clues\"\
          : unique(image_data.get(\"product_clues\", []) if isinstance(image_data.get(\"\
          product_clues\"), list) else []) if profile_allowed else [],\n        \"\
          reference_image_intent\": str(image_data.get(\"reference_image_intent\"\
          ) or \"\") if profile_allowed else \"\",\n        \"conflicts\": unique(conflicts)\
          \ if profile_allowed else [],\n        \"evidence_message_ids\": unique([str(v)\
          \ for v in evidence_messages if str(v).strip()]) if profile_allowed else\
          \ [],\n        \"evidence_event_ids\": unique([str(v) for v in evidence_events\
          \ if str(v).strip()]) if profile_allowed else [],\n        \"updated_summary\"\
          : summary if profile_allowed else \"\",\n        \"next_best_action\": next_action\
          \ if profile_allowed else \"\",\n        \"processing_meta\": {\n      \
          \      \"text_used\": bool(text_data.get(\"profile_items\") or text_data.get(\"\
          profile_patch\")),\n            \"image_used\": bool(image_data.get(\"profile_items\"\
          ) or image_data.get(\"visual_preferences\")),\n            \"behavior_used\"\
          : bool(behavior_data.get(\"behavior_summary\")),\n            \"consent_applied\"\
          : profile_allowed,\n        },\n    }\n    return {\"result\": json.dumps(result,\
          \ ensure_ascii=False)}\n"
        variables:
        - variable: payload_json
          value_selector:
          - preprocess
          - payload_json
        - variable: text_analysis
          value_selector:
          - text_aggregate
          - output
        - variable: image_analysis
          value_selector:
          - image_aggregate
          - output
        - variable: behavior_analysis
          value_selector:
          - behavior_aggregate
          - output
        outputs:
          result:
            type: string
            children: null
        selected: false
      position:
        x: 1500
        y: 400
      positionAbsolute:
        x: 1500
        y: 400
      width: 242
      height: 145
      selected: false
      sourcePosition: right
      targetPosition: left
