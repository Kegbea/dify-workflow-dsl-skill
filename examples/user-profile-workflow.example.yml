        type: code
        title: 输出质量门
        desc: 检查稳定契约、标记降级结果和需要人工复核的冲突。
        code_language: python3
        code: "import json\n\n\nREQUIRED = {\n    \"schema_version\", \"user_id\"\
          , \"profile_patch\", \"profile_items\", \"tags\",\n    \"segments\", \"\
          intent_level\", \"intent_score\", \"updated_summary\",\n    \"next_best_action\"\
          , \"processing_meta\",\n}\n\n\ndef main(merged_result):\n    try:\n    \
          \    data = json.loads(str(merged_result or \"{}\"))\n    except Exception:\n\
          \        data = {}\n    missing = sorted(REQUIRED - set(data))\n    data[\"\
          quality\"] = {\n        \"status\": \"degraded\" if missing else \"passed\"\
          ,\n        \"missing_fields\": missing,\n        \"review_required\": bool(data.get(\"\
          conflicts\")) or data.get(\"intent_score\", 0) >= 90,\n    }\n    return\
          \ {\"result\": json.dumps(data, ensure_ascii=False)}\n"
