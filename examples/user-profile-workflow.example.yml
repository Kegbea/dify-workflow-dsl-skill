    - id: behavior_analyze
      type: custom
      data:
        type: code
        title: 行为意向评分
        desc: 用确定性规则计算行为强度、兴趣产品和下一步动作。
        code_language: python3
        code: "import json\nfrom collections import Counter\n\n\ndef main(behavior_context):\n\
          \    try:\n        context = json.loads(str(behavior_context or \"{}\"))\n\
          \    except Exception:\n        context = {}\n    events = context.get(\"\
          events\") if isinstance(context.get(\"events\"), list) else []\n    types,\
          \ products, evidence = Counter(), Counter(), []\n    recency_weighted_score\
          \ = 0\n    weights = {\"purchase\": 40, \"checkout\": 25, \"add_to_cart\"\
          : 18, \"inquiry\": 15, \"favorite\": 10, \"view\": 3}\n    for item in events:\n\
          \        if not isinstance(item, dict):\n            continue\n        event_type\
          \ = str(item.get(\"event_type\") or item.get(\"type\") or \"unknown\").lower()\n\
          \        types[event_type] += 1\n        product = str(item.get(\"product\"\
          ) or item.get(\"product_id\") or \"\").strip()\n        if product:\n  \
          \          products[product] += 1\n        event_id = str(item.get(\"event_id\"\
          ) or \"\").strip()\n        if event_id:\n            evidence.append(event_id)\n\
          \        recency_weighted_score += weights.get(event_type, 1)\n    intent_score\
          \ = min(100, recency_weighted_score)\n    level = \"high\" if intent_score\
          \ >= 45 else \"medium\" if intent_score >= 18 else \"low\"\n    top_products\
          \ = [name for name, _ in products.most_common(5)]\n    tags = [\"behavior:%s\"\
          \ % name for name, count in types.most_common(3) if name != \"unknown\"\
          \ and count]\n    result = {\n        \"behavior_summary\": {\"event_count\"\
          : len(events), \"event_types\": dict(types), \"top_products\": top_products},\n\
          \        \"intent_score\": intent_score,\n        \"intent_level\": level,\n\
          \        \"tags\": tags,\n        \"segments\": [\"high_intent\"] if level\
          \ == \"high\" else [\"engaged\"] if level == \"medium\" else [],\n     \
          \   \"profile_items\": ([{\"key\": \"interested_products\", \"value\": top_products,\
          \ \"confidence\": 0.75, \"evidence_event_ids\": evidence, \"source\": \"\
          behavior\"}] if top_products else []),\n        \"evidence_event_ids\":\
          \ list(dict.fromkeys(evidence)),\n        \"next_best_action\": \"优先跟进高意向行为\"\
          \ if level == \"high\" else \"根据近期浏览内容提供相关推荐\" if events else \"\",\n  \
          \  }\n    return {\"result\": json.dumps(result, ensure_ascii=False)}\n"
        variables:
        - variable: behavior_context
          value_selector:
          - preprocess
          - behavior_context
        outputs:
          result:
            type: string
            children: null
