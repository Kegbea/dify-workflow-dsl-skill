    - id: preprocess
      type: custom
      data:
        type: code
        title: 输入解析与隐私边界
        desc: 解析消息、图片、行为事件、当前画像、历史摘要和用户授权。
        code_language: python3
        code: "import json\n\n\ndef main(raw_payload, image_files):\n    raw = str(raw_payload\
          \ or \"\").strip()\n    try:\n        payload = json.loads(raw or \"{}\"\
          )\n    except Exception:\n        payload = {\n            \"user_id\":\
          \ \"manual-preview\",\n            \"current_profile\": {},\n          \
          \  \"history_summary\": \"\",\n            \"new_messages\": [{\"message_id\"\
          : \"manual-1\", \"message_type\": \"text\", \"content\": raw}],\n      \
          \      \"behavior_events\": [],\n            \"consent\": {\"profile_analysis\"\
          : True},\n        }\n    if not isinstance(payload, dict):\n        payload\
          \ = {}\n\n    messages = payload.get(\"new_messages\") if isinstance(payload.get(\"\
          new_messages\"), list) else []\n    behaviors = payload.get(\"behavior_events\"\
          ) if isinstance(payload.get(\"behavior_events\"), list) else []\n    text_items,\
          \ image_items = [], []\n    for index, item in enumerate(messages):\n  \
          \      if not isinstance(item, dict):\n            continue\n        message_id\
          \ = str(item.get(\"message_id\") or \"message-%s\" % (index + 1))\n    \
          \    message_type = str(item.get(\"message_type\") or \"text\").lower()\n\
          \        base = {\n            \"message_id\": message_id,\n           \
          \ \"sender_type\": str(item.get(\"sender_type\") or \"customer\"),\n   \
          \         \"sent_at\": str(item.get(\"sent_at\") or \"\"),\n        }\n\
          \        if message_type == \"text\":\n            content = str(item.get(\"\
          content\") or \"\").strip()\n            if content:\n                text_items.append(dict(base,\
          \ content=content))\n        elif message_type in {\"image\", \"emotion\"\
          }:\n            media_url = str(item.get(\"media_url\") or \"\").strip()\n\
          \            if media_url:\n                image_items.append(dict(base,\
          \ media_url=media_url))\n\n    uploads = image_files if isinstance(image_files,\
          \ list) else []\n    if not image_items:\n        for index, item in enumerate(uploads):\n\
          \            if not isinstance(item, dict):\n                continue\n\
          \            image_items.append({\n                \"message_id\": str(item.get(\"\
          id\") or \"upload-%s\" % (index + 1)),\n                \"sender_type\"\
          : \"customer\",\n                \"sent_at\": \"\",\n                \"\
          media_url\": str(item.get(\"url\") or item.get(\"remote_url\") or \"\"),\n\
          \                \"file_name\": str(item.get(\"name\") or item.get(\"filename\"\
          ) or \"\"),\n            })\n\n    common = {\n        \"user_id\": str(payload.get(\"\
          user_id\") or payload.get(\"relation_id\") or \"\"),\n        \"current_profile\"\
          : payload.get(\"current_profile\") if isinstance(payload.get(\"current_profile\"\
          ), dict) else {},\n        \"history_summary\": str(payload.get(\"history_summary\"\
          ) or \"\"),\n        \"consent\": payload.get(\"consent\") if isinstance(payload.get(\"\
          consent\"), dict) else {},\n    }\n    return {\n        \"payload_json\"\
          : json.dumps(payload, ensure_ascii=False),\n        \"text_context\": json.dumps(dict(common,\
          \ messages=text_items), ensure_ascii=False),\n        \"image_context\"\
          : json.dumps(dict(common, images=image_items), ensure_ascii=False),\n  \
          \      \"behavior_context\": json.dumps(dict(common, events=behaviors),\
          \ ensure_ascii=False),\n        \"has_text\": bool(text_items),\n      \
          \  \"has_images\": bool(image_items),\n        \"has_behavior\": bool(behaviors),\n\
          \    }\n"
        variables:
        - variable: raw_payload
          value_selector:
          - start
          - payload
        - variable: image_files
          value_selector:
          - start
          - image_files
        outputs:
          payload_json:
            type: string
            children: null
          text_context:
            type: string
            children: null
          image_context:
            type: string
            children: null
          behavior_context:
            type: string
            children: null
          has_text:
            type: boolean
            children: null
          has_images:
            type: boolean
            children: null
          has_behavior:
            type: boolean
            children: null
