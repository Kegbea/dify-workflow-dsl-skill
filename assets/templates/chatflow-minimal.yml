app:
  description: Minimal Chatflow template without workspace-bound plugins.
  icon: "💬"
  icon_background: "#D5F5F6"
  icon_type: emoji
  mode: advanced-chat
  name: Minimal Chatflow
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: "0.7.0"
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: [local_file, remote_url]
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods: [local_file, remote_url]
      number_limits: 3
    opening_statement: ""
    retriever_resource: {enabled: false}
    sensitive_word_avoidance: {enabled: false}
    speech_to_text: {enabled: false}
    suggested_questions: []
    suggested_questions_after_answer: {enabled: false}
    text_to_speech: {enabled: false, language: "", voice: ""}
  graph:
    edges:
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: start
          targetType: code
        id: start_source_echo_target
        selected: false
        source: start
        sourceHandle: source
        target: echo
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: code
          targetType: answer
        id: echo_source_answer_target
        selected: false
        source: echo
        sourceHandle: source
        target: answer
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      - data:
          selected: false
          title: Start
          type: start
          variables: []
        height: 90
        id: start
        position: {x: 0, y: 200}
        positionAbsolute: {x: 0, y: 200}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |-
            def main(query):
                text = str(query or "").strip()
                return {"result": text or "Please enter a message."}
          code_language: python3
          outputs:
            result:
              children: null
              type: string
          selected: false
          title: Echo
          type: code
          variables:
            - value_selector: [sys, query]
              variable: query
        height: 100
        id: echo
        position: {x: 344, y: 200}
        positionAbsolute: {x: 344, y: 200}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          answer: "{{#echo.result#}}"
          selected: false
          title: Answer
          type: answer
          variables: []
        height: 90
        id: answer
        position: {x: 688, y: 200}
        positionAbsolute: {x: 688, y: 200}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
    viewport: {x: 0, y: 0, zoom: 0.8}
  rag_pipeline_variables: []

