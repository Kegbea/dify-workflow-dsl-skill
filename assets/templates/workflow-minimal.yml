app:
  description: Minimal stateless Workflow template without workspace-bound plugins.
  icon: "⚙️"
  icon_background: "#E4FBCC"
  icon_type: emoji
  mode: workflow
  name: Minimal Workflow
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: "0.7.0"
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: [local_file, remote_url]
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods: [local_file, remote_url]
      number_limits: 3
    opening_statement: ""
    retriever_resource: {enabled: false}
    sensitive_word_avoidance: {enabled: false}
    speech_to_text: {enabled: false}
    suggested_questions: []
    suggested_questions_after_answer: {enabled: false}
    text_to_speech: {enabled: false, language: "", voice: ""}
  graph:
    edges:
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: start
          targetType: code
        id: start_source_normalize_target
        selected: false
        source: start
        sourceHandle: source
        target: normalize
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: code
          targetType: end
        id: normalize_source_end_target
        selected: false
        source: normalize
        sourceHandle: source
        target: end
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      - data:
          selected: false
          title: Start
          type: start
          variables:
            - label: Input
              max_length: 50000
              required: true
              type: paragraph
              variable: input_text
        height: 90
        id: start
        position: {x: 0, y: 200}
        positionAbsolute: {x: 0, y: 200}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          code: |-
            def main(input_text):
                return {"result": str(input_text or "").strip()}
          code_language: python3
          outputs:
            result:
              children: null
              type: string
          selected: false
          title: Normalize
          type: code
          variables:
            - value_selector: [start, input_text]
              variable: input_text
        height: 100
        id: normalize
        position: {x: 344, y: 200}
        positionAbsolute: {x: 344, y: 200}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          outputs:
            - value_selector: [normalize, result]
              value_type: string
              variable: result
          selected: false
          title: End
          type: end
        height: 90
        id: end
        position: {x: 688, y: 200}
        positionAbsolute: {x: 688, y: 200}
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
    viewport: {x: 0, y: 0, zoom: 0.8}
  rag_pipeline_variables: []

