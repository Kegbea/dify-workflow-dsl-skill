name: Bug report
description: Report incorrect generation, validation, or documentation
title: "[Bug] "
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: Skill version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: dify_version
    attributes:
      label: Dify and App DSL versions
      placeholder: Dify 1.17.x / App DSL 0.7.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include a minimal sanitized DSL or prompt when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validator output
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed credentials, customer data, and private dataset identifiers.
          required: true
